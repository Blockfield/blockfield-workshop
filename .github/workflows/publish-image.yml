name: Publish workshop image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workshop-image-publish
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/blockfield/blockfield-workshop:sha-${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
      - name: Record immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          printf 'Commit: %s\n\nImage: ghcr.io/blockfield/blockfield-workshop@%s\n' \
            "$IMAGE_REVISION" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
