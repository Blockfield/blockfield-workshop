name: Check workshop
on:
  push:
    branches: [main]
  # Bot-gate (enforcing): PR CI runs only when the GitHub App
  # `blockfield-review-bot[bot]` approves the CURRENT head SHA. Pushes to a PR
  # branch fire no workflow run at all; only the bot's APPROVED `pull_request_review`
  # (submitted) starts a runner. Any other review matches the trigger but skips
  # every job at the job-level `if:`, so the run is all-skipped and bills
  # 0 minutes. A stale approval (push between the
  # review and the run) is rejected by the commit_id == head SHA check below.
  # Draft PRs get no bot verdict, so no CI runs until the PR is marked ready.
  # Merge protection pairs this gate with the bot's own `bot-review` commit
  # status on the head SHA (success = approved, failure = changes requested).
  # Merge-tree note: review runs test the head tree, not the merge ref. That
  # is safe only paired with branch protection "require up to date" (an
  # up-to-date merge == the head tree) plus the main-push same-tree check,
  # which runs full CI whenever a merge produces a tree no green run
  # tested. The controller image workflow stays unconditional.
  pull_request_review:
    types: [submitted]
  # Maintainer-only manual override (no bot verdict needed): run it from the
  # PR branch and record why. Ordinary contributors cannot bypass the gate
  # with this; misuse is visible in the run history.
  workflow_dispatch:
    inputs:
      reason:
        description: "Override reason (maintainers only)"
        required: true
        type: string
  # Reusable by other workflows: called runs bypass the gate (the caller
  # was already gated or runs on main).
  workflow_call:
permissions:
  contents: read
  pull-requests: read # bot-gate reads blockfield-review-bot verdicts on the head SHA
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'pull_request_review' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'review-noise' || 'gate' }}
  # A review must never cancel the run it gates.
  cancel-in-progress: false
jobs:
  bot-gate:
    name: ${{ (github.event_name == 'pull_request_review' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'bot-gate (skipped review)' || 'bot-gate' }}
    # Enforcing: `check` runs on a PR head only when this job reports
    # verdict=permit with sha_match=true for the CURRENT head SHA, resolved
    # from the API at gate runtime (a push may have landed after the
    # triggering review event was created; the event payload would still name
    # the old head). The event head must equal the runtime head, and the
    # bot's latest verdict-bearing review on that SHA must be APPROVED.
    # Anything else (stale event, no verdict yet, REQUEST_CHANGES, DISMISSED,
    # a verdict on an older SHA) skips `check`, so the gate fails closed.
    # Always exits 0: denial is expressed through the outputs, and the bot's
    # own `bot-review` commit status blocks merge.
    runs-on: tenki-standard-autoscale
    timeout-minutes: 5
    if: github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name == github.repository && github.event.review.user.login == 'blockfield-review-bot[bot]' && github.event.review.state == 'approved'
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      sha_match: ${{ steps.gate.outputs.sha_match }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Evaluate blockfield-review-bot verdict for the current PR head SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          bot='blockfield-review-bot[bot]'
          repo="${{ github.repository }}"
          # Current head, not the event snapshot: the review that triggered
          # this run may predate a newer push. Only the still-current head
          # may pass; a stale event waits for the newer review's run.
          HEAD_SHA=$(gh api "repos/$repo/pulls/$PR_NUMBER" --jq '.head.sha')
          verdict=deny-awaiting
          sha_match=false
          if [ "$EVENT_SHA" = "$HEAD_SHA" ]; then
            # Latest verdict-bearing bot review on the current head,
            # aggregated across API pages (gh --jq applies per page).
            # COMMENTED reviews carry no verdict and are excluded, so a later
            # comment cannot override an earlier verdict. (jq is preinstalled
            # on the runner. The head SHA is spliced in; gh --jq takes no
            # variable arguments.)
            state=$(gh api "repos/$repo/pulls/$PR_NUMBER/reviews" --paginate               --jq '[.[] | select(.user.login == "'"$bot"'" and .commit_id == "'"$HEAD_SHA"'")]'               | jq -r -s '[add[] | select(.state != "COMMENTED")] | sort_by(.id) | last | .state // empty')
            # The API returns uppercase states ("APPROVED"); normalize anyway.
            state=$(printf '%s' "$state" | tr '[:lower:]' '[:upper:]')
            case "$state" in
              APPROVED)
                verdict=permit
                sha_match=true
                ;;
              # CHANGES_REQUESTED -> deny; DISMISSED / empty stay
              # deny-awaiting (fail-closed).
              CHANGES_REQUESTED) verdict=deny ;;
            esac
          fi
          # `sha` always names the evaluated runtime head so logs and the
          # checkout below agree on what was gated.
          echo "event=${EVENT_SHA:0:12} head=${HEAD_SHA:0:12} bot_state=${state:-none} verdict=$verdict sha_match=$sha_match"
          {
            echo "verdict=$verdict"
            echo "sha_match=$sha_match"
            echo "sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
  decide:
    name: ${{ (github.event_name == 'pull_request_review' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'decide (skipped review)' || 'decide' }}
    # Same gate as bot-gate: a non-approving or non-bot review must not start
    # a runner here either. Push, manual-dispatch and reusable-call runs always run.
    if: github.event_name != 'pull_request_review' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.review.user.login == 'blockfield-review-bot[bot]' && github.event.review.state == 'approved')
    runs-on: tenki-standard-autoscale
    timeout-minutes: 10
    # Only decide reads Actions data; check runs PR code and keeps the narrow token.
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.same.outputs.tested }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Main pushes usually merge a tree a green review run already tested.
      # Review runs check out the head SHA, so the recorded tree is the head tree.
      # The branch filter keeps the release merge (next->main) inside the
      # run-list window; anything else failing the lookup runs full CI.
      - name: Check for green run of the same tree
        id: same
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=$(scripts/ci-same-tree.sh check.yml next)
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
  check:
    name: ${{ (github.event_name == 'pull_request_review' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'check (skipped review)' || 'check' }}
    # Main pushes, maintainer dispatches and reusable-workflow calls always
    # run; PR heads run only on a gate permit for the exact head SHA.
    # Main pushes additionally skip re-verification when a green run already
    # tested this tree (the release merge next->main is the common case).
    # `always()` keeps push/call CI working even though `bot-gate` is skipped
    # off review events.
    needs: [bot-gate, decide]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (needs.bot-gate.outputs.verdict == 'permit' && needs.bot-gate.outputs.sha_match == 'true')) && needs.decide.outputs.tested != 'true'
    runs-on: tenki-standard-autoscale
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_review' && needs.bot-gate.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      # The AI sidecar (Java 21) and google-java-format 1.36.1 need JDK 21;
      # the runner image's default JAVA_HOME is 17.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.lock.json', 'scripts/toolchain.py', 'scripts/toolchain_local.py', 'scripts/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - run: just setup
      - run: just check
      # Records the exact tree this green run tested, so a merge whose tree a
      # green review run already tested can skip re-verification (the lookup
      # compares trees, so all shapes dedupe correctly).
      - name: Record tested merge tree
        id: tree
        if: github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch'
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          echo "$tree" > tested-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload tested merge tree
        if: github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7
          if-no-files-found: error
