name: Windows portability
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "release-notes/**"
      - "LICENSE"
      - "NOTICE"
      - "Dockerfile"
      - "systemd/**"
      - "e2e/**"
      - "controller.py"
      - "docker_backend.py"
      - "candidates.py"
      - "limbo.py"
      - "workshopctl.py"
      - "map_ids.json"
      - "test_controller*.py"
      - "test_docker_backend.py"
      - "test_candidates.py"
      - "test_limbo.py"
      - "test_workshop*.py"
      - "test_map_versions.py"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "release-notes/**"
      - "LICENSE"
      - "NOTICE"
      - "Dockerfile"
      - "systemd/**"
      - "e2e/**"
      - "controller.py"
      - "docker_backend.py"
      - "candidates.py"
      - "limbo.py"
      - "workshopctl.py"
      - "map_ids.json"
      - "test_controller*.py"
      - "test_docker_backend.py"
      - "test_candidates.py"
      - "test_limbo.py"
      - "test_workshop*.py"
      - "test_map_versions.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - run: just setup
      - run: just check
