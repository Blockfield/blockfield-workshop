name: Warm CI caches
# PR CI (`check.yml`, bot-gated `pull_request_review`) restores the quality
# tools cache (`quality-tools-v1-*`), but a review run reads only its own
# ref's scope and the default branch (`main`) — never the base branch
# (`next`). Measured: runs 43021725182 and 43022471547 missed the SAME key
# minutes apart (each saved under its own unreadable PR-ref scope), while
# the `main` push 43022997745 same-tree-skipped in seconds and saved nothing.
# This workflow therefore warms under the default-branch ref: pushes to
# `next` only dispatch (cheap, runs in seconds), and the dispatched run
# (ref `main`, tree `next`) saves exactly the entry the `check` workflow
# restores, which review runs then hit.
# Only workflow_dispatch/push/schedule runs may write the default-branch
# scope, so the dispatch targets `--ref main` (the file must exist on `main`,
# i.e. this starts working after the next release merge carries it over;
# until then the dispatch step skips silently and first runs stay cold).
# Keys and paths are copies of check.yml's; scripts/quality.py lint() fails
# the PR gate if they ever differ (no silent drift).
on:
  push:
    branches: [next]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warm-caches
  cancel-in-progress: true
jobs:
  dispatch:
    # A push-to-`next` run would save under the `next` scope, which no review
    # run reads: warming here burns minutes without a reader. Forward instead.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch main-scope warm run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The dispatched file resolves on `main`. Pre-release it is not
          # there yet, so the dispatch would 404: skip, caches stay cold.
          if gh api "repos/${{ github.repository }}/contents/.github/workflows/warm-caches.yml?ref=main" >/dev/null 2>&1; then
            gh workflow run warm-caches.yml --repo "${{ github.repository }}" --ref main
          else
            echo "warm-caches.yml not on main yet (pre-release); skipping"
          fi
  warm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          # Run under the default-branch ref (cache scope) but warm the tree
          # reviewers will build. Fixed, not an input: this entry feeds every
          # PR check, so a dispatch must not be able to fill it from another ref.
          ref: next
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.lock.json', 'scripts/toolchain.py', 'scripts/toolchain_local.py', 'scripts/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
