name: Tools drift
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Check vendored core matches workspace origin/main
        env:
          BF_DRIFT_CHECK: "1"
        run: python3 -X utf8 -m unittest test_vendored.VendoredCore.test_vendored_files_equal_workspace_origin_main -v
