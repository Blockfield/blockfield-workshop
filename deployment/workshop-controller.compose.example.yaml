# Dokploy application spec for the Workshop controller (documentation only).
#
# Creating this application needs explicit owner approval (see
# docs/OPERATIONS.md "Container packaging"). Apply nothing from here to the
# production Dokploy installation without that approval.
#
# Storage contract (contract §5): managed named volumes only. This file
# declares no host path, socket, device, host namespace or extra capability.
# The controller consumes Workshop operations over Control Plane SSE, reads
# and pushes state documents via CP state API, and controls the Workshop game
# lifecycle through the Workshop game's CP consumer (ws-game) + the Dokploy
# redeploy webhook.
#
# Image: built from this repository's Dockerfile, published as an immutable
# digest; the application points at the fixed :approved tag which is moved
# only after a verified release (same tag discipline as the Workshop app).
# The controller needs no Dokploy API token: lifecycle goes through the
# approved-tag registry move, the app deploy webhook and the Control Plane.
services:
  controller:
    image: ghcr.io/blockfield/blockfield-workshop-controller:approved
    working_dir: /app
    # Loopback only; nothing is published. The in-image HEALTHCHECK queries
    # 127.0.0.1:8080/healthz from inside the container.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 100
      restart_policy:
        condition: unless-stopped
    environment:
      BF_WORKSHOP_BACKEND: dokploy
      BF_STATE_DIR: /state
      BF_GATE_FILE: /state/gate/gate.json
      BF_PUBLIC_FILE: /state/public/public.json
      BF_ADMIN_DIR: /state/admin
      BF_WORKSHOP_DATA: /data
      BF_LOCK_DIR: /locks
      BF_MAP_ARCHIVE_DIR: /data/history
      BF_MAP_ACTIVE_DIR: /data/active
      BF_TEMPLATES_DIR: /templates
      BF_PUBLISHED_MAPS_DIR: /published
      BF_RELEASES_FILE: /state/releases.json
      BF_STEP_INTERVAL_S: 15
      BF_STEP_FOLLOW_S: 12
      BF_STEP_POLL_S: 2
      BF_WORKSHOP_READY_TTL_S: 60
      BF_HEALTH_PORT: 8080
    volumes:
      # Private controller state (read-write, controller only).
      - controller-state:/state
      # Workshop data and lifecycle receipts (single writer: this controller).
      - workshop-data:/data
      # Backend lock directory (single writer proof).
      - controller-locks:/locks
      # Established read-only inputs, verified before any handover.
      - workshop-templates:/templates:ro
      - workshop-published:/published:ro

volumes:
  controller-state: {}
  workshop-data: {}
  controller-locks: {}
  workshop-templates: {}
  workshop-published: {}
