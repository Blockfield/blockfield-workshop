# Dokploy application spec for the Workshop controller (documentation only).
#
# Creating this application needs explicit owner approval (see
# docs/OPERATIONS.md "Container packaging"). Apply nothing from here to the
# production Dokploy installation without that approval.
#
# Storage contract (contract §5): managed named volumes only. This file
# declares no host path, socket, device, host namespace or extra capability.
# The data interface behind workshop-data/templates/published (MapStore
# directories, inbox, projections) is a separately approved dependency: until
# it is supplied and verified, finish packaging/shadow evidence and keep
# production on the host controller.
#
# Image: built from this repository's Dockerfile, published as an immutable
# digest; the application points at the fixed :approved tag which is moved
# only after a verified release (same tag discipline as the Workshop app).
# The controller needs no Dokploy API token: lifecycle goes through the
# approved-tag registry move, the app deploy webhook and in-container
# RCON/HTTP. RCON reaches the Workshop app over the private Dokploy network.
services:
  controller:
    image: ghcr.io/blockfield/blockfield-workshop-controller:approved
    working_dir: /app
    # Loopback only; nothing is published. The in-image HEALTHCHECK queries
    # 127.0.0.1:8080/healthz from inside the container.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 100
      restart_policy:
        condition: unless-stopped
    environment:
      BF_WORKSHOP_BACKEND: dokploy
      BF_STATE_DIR: /state
      BF_GATE_FILE: /state/gate/gate.json
      BF_PUBLIC_FILE: /state/public/public.json
      BF_ADMIN_DIR: /state/admin
      BF_INBOX_DIR: /state/inbox
      BF_WORKSHOP_DATA: /data
      BF_LOCK_DIR: /locks
      BF_MAP_ARCHIVE_DIR: /data/history
      BF_MAP_ACTIVE_DIR: /data/active
      BF_TEMPLATES_DIR: /templates
      BF_PUBLISHED_MAPS_DIR: /published
      BF_RELEASES_FILE: /state/releases.json
      BF_STEP_INTERVAL_S: 15
      BF_STEP_FOLLOW_S: 12
      BF_STEP_POLL_S: 2
      BF_HEALTH_PORT: 8080
      BF_WORKSHOP_APPROVED_REPOSITORY: ghcr.io/blockfield/blockfield-server
      BF_WORKSHOP_RCON_HOST: blockfield-workshop
      BF_WORKSHOP_RCON_PORT: 25575
      # Secrets below come from Dokploy-managed secret files mounted into the
      # container; their values never appear here, in logs or in state.
      BF_GHCR_PACKAGE_TOKEN_FILE: /run/secrets/ghcr-package-token
      BF_WORKSHOP_DEPLOY_WEBHOOK_URL_FILE: /run/secrets/workshop-deploy-webhook-url
      BF_WORKSHOP_RCON_PASSWORD_FILE: /run/secrets/workshop-rcon-password
    volumes:
      # Private controller state (read-write, controller only).
      - controller-state:/state
      # Workshop data and lifecycle receipts (single writer: this controller).
      - workshop-data:/data
      # Backend lock directory (single writer proof, held beside Java life).
      - controller-locks:/locks
      # Established read-only inputs, verified before any handover.
      - workshop-templates:/templates:ro
      - workshop-published:/published:ro
    secrets:
      - ghcr-package-token
      - workshop-deploy-webhook-url
      - workshop-rcon-password

volumes:
  controller-state: {}
  workshop-data: {}
  controller-locks: {}
  workshop-templates: {}
  workshop-published: {}

secrets:
  ghcr-package-token:
    file: /etc/blockfield/ghcr-package-token
  workshop-deploy-webhook-url:
    file: /etc/blockfield/workshop-deploy-webhook-url
  workshop-rcon-password:
    file: /etc/blockfield/workshop-rcon-password
