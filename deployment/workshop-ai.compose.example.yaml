# Merge these fields into the existing Workshop service; image/version stays in its base deployment.
# Install workshop-ai.example.json at /srv/minecraft/workshop/data/config/blockfield/workshop-ai.json.
# It remains disabled. Enabling or deploying requires the owner's explicit approval.
services:
  workshop:
    environment:
      BLOCKFIELD_PROFILE: workshop
      BLOCKFIELD_WORKSHOP_AI_LIMITS_FILE: /blockfield-admin/ai-limits.json
      BLOCKFIELD_WORKSHOP_AI_USAGE_FILE: /data/blockfield-workshop/ai-usage.json
      # At approved enablement, the owner supplies BLOCKFIELD_WORKSHOP_AI_OPENROUTER_KEY
      # in this service's private environment: a separate capped normal-credit key.
      # AI sidecar (server#321): URL plus the read-only copy of the controller-written
      # ai-sidecar.key the mod presents as Bearer; provider keys never mount here.
      BLOCKFIELD_WORKSHOP_AI_SIDECAR_URL: http://ai-sidecar:8101
      BLOCKFIELD_WORKSHOP_AI_SIDECAR_KEY_FILE: /etc/ai-sidecar/ai-sidecar.key
    volumes:
      - type: bind
        source: /srv/minecraft/workshop/data
        target: /data
        read_only: false
      - type: bind
        source: /srv/minecraft/views/blockfield-admin
        target: /blockfield-admin
        read_only: true
      - type: bind
        source: /srv/minecraft/workshop/data/blockfield-workshop/ai-sidecar.key
        target: /etc/ai-sidecar/ai-sidecar.key
        read_only: true
  # Workshop AI sidecar (server#321): own image next to the controller (ai-sidecar/Dockerfile).
  # Provider keys mount sidecar-only; the game container above sees only ai-sidecar.key.
  ai-sidecar:
    image: ghcr.io/blockfield/blockfield-workshop-ai-sidecar:approved
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AI_SIDECAR_BIND: 0.0.0.0
      AI_SIDECAR_PORT: 8101
      AI_SIDECAR_KEY_FILE: /keys/ai-sidecar.key
      # U-AI1 ledger + provider clients. Uncomment at approved enablement; the owner
      # supplies the key files' contents out of band (never in this file):
      # AI_SIDECAR_PROVIDER: openrouter
      # AI_SIDECAR_PROVIDER_KEY_FILE: /keys/openrouter.key
      # AI_SIDECAR_POLICY_FILE: /keys/ai-limits.json
      # AI_SIDECAR_LEDGER_FILE: /data/blockfield-workshop/ai-usage.json
    volumes:
      - type: bind
        source: /srv/minecraft/workshop/data/blockfield-workshop
        target: /keys
        read_only: true
      # Ledger read-write volume (uncomment with AI_SIDECAR_LEDGER_FILE above):
      # - type: bind
      #   source: /srv/minecraft/workshop/data/blockfield-workshop
      #   target: /data/blockfield-workshop
      #   read_only: false
